{{- if and .Values.enabled .Values.gateway.enabled .Values.gateway.tls.generated }}
{{- $caName := include "control-plane.gatewayCASecretName" . }}
{{- $tlsName := include "control-plane.gatewayTLSSecretName" . }}
{{- $existingCA := lookup "v1" "Secret" .Release.Namespace $caName }}
{{- $ca := genCA (printf "%s platform workload CA" .Release.Name) 3650 }}
{{- if $existingCA }}
{{- $ca = buildCustomCert (index $existingCA.data "tls.crt") (index $existingCA.data "tls.key") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-ca
type: kubernetes.io/tls
data:
{{- if $existingCA }}
{{- range $k, $v := $existingCA.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- else }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $ca.Cert | b64enc | quote }}
  tls.key: {{ $ca.Key | b64enc | quote }}
{{- end }}
---
# cert-manager resolves ClusterIssuer CA Secrets from its cluster-resource
# namespace, not the workload namespace. Mirror the same stable keypair there;
# gateway workloads continue mounting the release-namespace copy.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  namespace: cert-manager
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-ca
    app.kubernetes.io/part-of: platform-workload-pki
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  tls.crt: {{ $ca.Cert | b64enc | quote }}
  tls.key: {{ $ca.Key | b64enc | quote }}
---
{{- $existingTLS := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- $gatewayName := include "control-plane.gatewayName" . }}
{{- $dnsNames := list $gatewayName (printf "%s.%s" $gatewayName .Release.Namespace) (printf "%s.%s.svc" $gatewayName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $gatewayName .Release.Namespace) }}
{{- $gatewayCert := genSignedCert $gatewayName nil $dnsNames 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: kubernetes.io/tls
data:
{{- if $existingTLS }}
{{- range $k, $v := $existingTLS.data }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- else }}
  tls.crt: {{ $gatewayCert.Cert | b64enc | quote }}
  tls.key: {{ $gatewayCert.Key | b64enc | quote }}
{{- end }}
---
# AgentPool worker leaves are issued from the same CA the gateway trusts for
# client authentication. The controller's CSI volume intentionally references
# this stable ClusterIssuer name; the CA private key remains in Kubernetes.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-spiffe-ca
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-ca
spec:
  ca:
    secretName: {{ $caName }}
{{- end }}
