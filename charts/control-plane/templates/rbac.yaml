{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "control-plane.serviceAccountName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "control-plane.serviceAccountName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.iterabase.com
  resources:
  - egressroutes
  - identitymappings
  - modelbackends
  - models
  - permissionpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.iterabase.com
  resources:
  - egressroutes/finalizers
  - identitymappings/finalizers
  - modelbackends/finalizers
  - models/finalizers
  - permissionpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - platform.iterabase.com
  resources:
  - egressroutes/status
  - identitymappings/status
  - modelbackends/status
  - models/status
  - permissionpolicies/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "control-plane.serviceAccountName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "control-plane.serviceAccountName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "control-plane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if .Values.gateway.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "control-plane.gatewayServiceAccountName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# Credential bindings resolve to operator-approved Secret names at runtime.
# Keep this namespace-scoped and separate from the manager's cluster RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "control-plane.gatewayServiceAccountName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "control-plane.gatewayServiceAccountName" . }}
  labels:
    {{- include "control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "control-plane.gatewayServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "control-plane.gatewayServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
