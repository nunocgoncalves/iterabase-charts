{{- if .Values.enabled }}
{{- if .Values.metrics.enabled }}
{{- $tls := (or .Values.tls.enabled (dig "internalTLS" "enabled" false (.Values.global | default (dict)))) }}
{{- $auth := (or .Values.auth.enabled $tls) }}
{{- $caSecret := (printf "%s-internal-ca-root" .Release.Name) }}
{{- $name := (printf "%s-redis-exporter" .Release.Name) }}
# redis-exporter: standalone Deployment + Service + ServiceMonitor. Separate pod
# (not a sidecar) per Prometheus exporter best practice. Connects with the AUTH
# password (mounted as a file) and the internal CA when TLS is on. The exporter
# pods carry component=exporter (distinct from the redis server's component=cache)
# so the main redis Service never selects them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: exporter
    spec:
      {{- if or $tls $auth }}
      volumes:
        {{- if $tls }}
        - name: internal-ca
          secret:
            secretName: {{ $caSecret }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- if $auth }}
        - name: redis-secret
          secret:
            secretName: {{ include "redis.secretName" . }}
            items:
              - key: redis-password
                path: redis-password
        {{- end }}
      {{- end }}
      containers:
        - name: redis-exporter
          image: "{{ .Values.metrics.image.repository }}:{{ .Values.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.metrics.image.pullPolicy }}
          args:
            - --redis.addr={{ include "redis.name" . }}:6379
            {{- if $auth }}
            - --redis.password-file=/etc/redis/secrets/redis-password
            {{- end }}
            {{- if $tls }}
            - --tls
            - --tls-ca-cert-file={{ .Values.tls.caMountPath }}
            {{- end }}
          ports:
            - name: http-metrics
              containerPort: 9121
          {{- if or $tls $auth }}
          volumeMounts:
            {{- if $tls }}
            - name: internal-ca
              mountPath: {{ dir .Values.tls.caMountPath }}
              readOnly: true
            {{- end }}
            {{- if $auth }}
            - name: redis-secret
              mountPath: /etc/redis/secrets
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: exporter
  ports:
    - name: http-metrics
      port: 9121
      targetPort: http-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "redis.name" . }}
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval | default "30s" }}
{{- end }}
{{- end }}
