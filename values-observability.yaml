# Observability preset for the iterabase-platform umbrella (CI: static
# kubeconform via `make check-observability`). Enables the observability stack
# (Prometheus + Grafana + Loki + Alertmanager + the Prometheus Operator CRDs)
# AND every component's metrics knob so the full ServiceMonitor / exporter /
# PrometheusRule render path is exercised. kind/E2E stays lean by default (this
# file is opt-in); the prod overlay carries the same flips plus Alertmanager
# email routing (HOR-408).
#
# Pair with values-kind.yaml for a kind install (the stack needs a StorageClass;
# kind ships local-path by default).

# --- The stack (Prometheus / Grafana / Loki / Alertmanager + operator CRDs) ---
observability:
  enabled: true
  # Enable NVIDIA DCGM (GPU) scraping in GPU/inference deploys; off here (no GPU
  # in kind). gpu-operator must be installed out-of-band for the target Service
  # to exist.
  dcgmExporter:
    enabled: false

# --- Component metrics knobs (ServiceMonitors / exporters) ---
inference-gateway:
  metrics:
    enabled: true

control-plane:
  metrics:
    enabled: true
    # vLLM / model-backend pods are operator-created; the scrape target depends
    # on the operator's pod template. Off by default — match the operator's
    # labels/port here (or via a service-repo ticket) to enable.
    vllm:
      enabled: false
  # postgresql is a subchart of control-plane; its exporter is nested here.
  postgresql:
    metrics:
      enabled: true

redis:
  metrics:
    enabled: true

minio:
  metrics:
    enabled: true

# --- Upstream charts' native metrics + ServiceMonitors ---
ingress-nginx:
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

metallb:
  prometheus:
    serviceMonitor:
      enabled: true
  # metallb itself must be enabled (kind preset / prod overlay) for its metrics
  # Service to exist; the ServiceMonitor is harmless without it.

cert-manager:
  prometheus:
    servicemonitor:
      enabled: true

external-dns:
  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
  # external-dns is disabled by default (no kind mode); the ServiceMonitor is
  # harmless without it.

reloader:
  metrics:
    enabled: true
